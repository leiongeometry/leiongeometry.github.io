<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lei Wang's academic homepage: geometry processing, intrinsic geometry, geometric learning, and selected publications."
    />
    <meta name="theme-color" content="#f3f0e9" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Lei Wang — Geometric Computing</title>
    <script>
      (() => {
        try {
          const stored = window.localStorage.getItem("lei-wang-theme");
          const theme = stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
